<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <!-- プラグイン埋め込みと <base> 差し替えを禁止(TextAlive/Songle の動的スクリプト読込に影響しない範囲の最小CSP) -->
    <meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'self'">
    <title>Ripple Lyrics - 水の循環 -</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%23041030'/><circle cx='16' cy='16' r='6' fill='none' stroke='%234a9eff' stroke-width='1.5' opacity='0.9'/><circle cx='16' cy='16' r='10' fill='none' stroke='%234a9eff' stroke-width='1' opacity='0.5'/></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Noto+Serif+JP:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/src/styles/base.css">
    <link rel="stylesheet" href="/src/styles/theme.css">
    <link rel="stylesheet" href="/src/styles/responsive.css">
    <script>
      // 裏リロード/チャンク復帰の直後は、body 既定の空色グラデ(base.css)が最初の1フレーム
      // 覗くのを防ぐ。body が描画される前のこの同期スクリプトで <html> にクラスを付け、
      // base.css の html.boot-recover ルールで暗色に固定する(キーは main.js の
      // RELOAD_RECOVER_KEY と一致させること)。フラグ自体は main.js 側で消費する。
      try { if (sessionStorage.getItem('mm_chunk_recovering') === '1') document.documentElement.classList.add('boot-recover'); } catch (e) {}
    </script>
</head>
<body>
    <div id="app">
        <!-- TextAlive Player Media Element -->
        <div id="media" style="display: none;"></div>
        
        <main id="scene-container">
            <!-- Three.js or Canvas will be mounted here -->
        </main>
        
        <!-- UI Container -->
        <div id="ui-container">
            <header>
                <div id="song-info">
                    <h1 id="song-title"></h1>
                    <p id="song-artist"></p>
                </div>
                <button id="back-to-lake" style="display: none;"><span style="font-size:16px">←</span> 湖面へ戻る<span class="kbd-hint"> (ESC)</span></button>
            </header>

            <footer>
                <div id="player-controls" style="display: none;">
                    <button id="play-pause-btn"><span style="font-size:16px">▶</span> Play<span class="kbd-hint"> (Space)</span></button>
                    <div id="progress-bar-container">
                        <div id="progress-bar"></div>
                    </div>
                </div>
            </footer>
        </div>
        
        <!-- Overlays -->
        <div id="loading-screen">波紋を読み込んでいます...</div>
        <div id="error-screen" style="display: none;"></div>
    </div>
    <script type="module" src="/src/main.js"></script>
</body>
</html>
