<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>湖のソナーレ — 問いが波紋になる世界</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Noto+Serif+JP:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/src/styles/base.css">
    <link rel="stylesheet" href="/src/styles/theme.css">
    <link rel="stylesheet" href="/src/styles/responsive.css">
</head>
<body>
    <div id="app">
        <!-- TextAlive Player Media Element -->
        <div id="media" style="display: none;"></div>
        
        <main id="scene-container">
            <!-- Three.js or Canvas will be mounted here -->
        </main>
        
        <!-- UI Container -->
        <div id="ui-container">
            <header>
                <div id="song-info">
                    <h1 id="song-title"></h1>
                    <p id="song-artist"></p>
                </div>
                <button id="back-to-lake" style="display: none;"><span style="font-size:16px">←</span> 湖面へ戻る (ESC)</button>
            </header>

            <footer>
                <div id="player-controls">
                    <button id="play-pause-btn"><span style="font-size:16px">▶</span> Play (Space)</button>
                    <div id="progress-bar-container">
                        <div id="progress-bar"></div>
                    </div>
                </div>
            </footer>
        </div>
        
        <!-- Overlays -->
        <div id="loading-screen">波紋を読み込んでいます...</div>
        <div id="error-screen" style="display: none;"></div>
    </div>
    <script type="module" src="/src/main.js"></script>
</body>
</html>
